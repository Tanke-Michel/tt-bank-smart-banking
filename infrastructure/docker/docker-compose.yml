# =============================================================
# Smart Banking System — Docker Compose
# Version: Production-ready local / VPS deployment
#
# Services:
#   Infrastructure : postgres, redis, rabbitmq
#   Backend        : api-gateway, auth-service, wallet-service,
#                    transaction-service, merchant-service,
#                    notification-service, savings-service,
#                    audit-service
#   Frontend       : frontend (React + Nginx)
#
# All application services use container hostnames (NOT localhost)
# for inter-service communication. Credentials are injected via
# environment variables — override with a .env file in production.
#
# Usage:
#   cp .env.example .env   # fill in real credentials
#   docker compose up -d --build
# =============================================================

version: '3.9'

# =============================================================
# Custom overlay network — all services communicate by name
# =============================================================
networks:
  tt-bank-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =============================================================
# Named volumes — data persists across container restarts
# =============================================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

# =============================================================
# Common anchor — reused JVM flags for all Spring Boot services
# =============================================================
x-java-defaults: &java-defaults
  restart: unless-stopped
  networks:
    - tt-bank-net
  environment:
    SPRING_PROFILES_ACTIVE: docker
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# =============================================================
# Services
# =============================================================
services:

  # -----------------------------------------------------------
  # PostgreSQL 16 — one instance, seven databases
  # init-db.sql creates all additional databases at first boot
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tt-bank-postgres
    networks:
      - tt-bank-net
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB:       tt_bank_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init-db.sql lives at the repo root, one level above Smart-Banking-System/
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d tt_bank_auth"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------
  # Redis 7 — OTP storage, JWT blacklisting, caching
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tt-bank-redis
    networks:
      - tt-bank-net
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------
  # RabbitMQ 3 with management UI
  # Event bus for all 14 banking domain events
  # -----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tt-bank-rabbitmq
    networks:
      - tt-bank-net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------
  # Auth Service — port 8081
  # JWT issuance, OTP email verification, Redis token blacklist
  # -----------------------------------------------------------
  auth-service:
    <<: *java-defaults
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: tt-bank-auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # Database
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/tt_bank_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      # Redis (password-protected)
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # JWT — MUST match api-gateway
      JWT_SECRET:                 ${JWT_SECRET:-3d7f4a9b2c8e1f5a6d9b3c7e2f8a1d4b7e3c9f2a6b5d8e1c4f7a2b3d6e9f0c1}
      JWT_ACCESS_TOKEN_EXPIRATION:  ${JWT_ACCESS_EXPIRY:-86400000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_EXPIRY:-604800000}
      # SMTP
      SPRING_MAIL_HOST:     ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT:     ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-your-email@gmail.com}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-your-app-password}
      # App URLs
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # Wallet Service — port 8082
  # Deposits, withdrawals, inter-wallet transfers
  # -----------------------------------------------------------
  wallet-service:
    <<: *java-defaults
    build:
      context: ../../services/wallet-service
      dockerfile: Dockerfile
    container_name: tt-bank-wallet
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/tt_bank_wallet
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_PORT:     5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      CAMPAY_BASE_URL:  ${CAMPAY_BASE_URL:-https://demo.campay.net/api/}
      CAMPAY_TOKEN:     ${CAMPAY_TOKEN:-}
      CAMPAY_USERNAME:  ${CAMPAY_USERNAME:-}
      CAMPAY_PASSWORD:  ${CAMPAY_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # Transaction Service — port 8083
  # P2P transfers; calls wallet-service via internal HTTP
  # -----------------------------------------------------------
  transaction-service:
    <<: *java-defaults
    build:
      context: ../../services/transaction-service
      dockerfile: Dockerfile
    container_name: tt-bank-transaction
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/tt_bank_transaction
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_PORT:     5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      # Internal service URL — uses container name as hostname
      APP_WALLET_SERVICE_BASE_URL: http://wallet-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # Merchant Service — port 8084
  # Merchant registration, QR code payments, admin control
  # -----------------------------------------------------------
  merchant-service:
    <<: *java-defaults
    build:
      context: ../../services/merchant-service
      dockerfile: Dockerfile
    container_name: tt-bank-merchant
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/tt_bank_merchant
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_PORT:     5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      APP_WALLET_SERVICE_BASE_URL: http://wallet-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # Notification Service — port 8085
  # RabbitMQ consumer; sends emails for all domain events
  # No database — stateless consumer
  # -----------------------------------------------------------
  notification-service:
    <<: *java-defaults
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: tt-bank-notification
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_PORT:     5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      SPRING_MAIL_HOST:     ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT:     ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-your-email@gmail.com}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-your-app-password}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # Savings Service — port 8086
  # Community savings groups, contributions, payouts
  # -----------------------------------------------------------
  savings-service:
    <<: *java-defaults
    build:
      context: ../../services/savings-service
      dockerfile: Dockerfile
    container_name: tt-bank-savings
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/tt_bank_savings
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_PORT:     5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      APP_WALLET_SERVICE_BASE_URL: http://wallet-service:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # Audit Service — port 8087
  # Admin-only; consumes all events and stores audit log
  # -----------------------------------------------------------
  audit-service:
    <<: *java-defaults
    build:
      context: ../../services/audit-service
      dockerfile: Dockerfile
    container_name: tt-bank-audit
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/tt_bank_audit
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      SPRING_RABBITMQ_HOST:     rabbitmq
      SPRING_RABBITMQ_PORT:     5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # API Gateway — port 8080
  # Single entry point: JWT validation, rate limiting, routing
  # Depends on all backend services being healthy
  # -----------------------------------------------------------
  api-gateway:
    <<: *java-defaults
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: tt-bank-gateway
    depends_on:
      auth-service:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      savings-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # JWT secret — MUST match auth-service exactly
      JWT_SECRET: ${JWT_SECRET:-3d7f4a9b2c8e1f5a6d9b3c7e2f8a1d4b7e3c9f2a6b5d8e1c4f7a2b3d6e9f0c1}
      # Override upstream URIs to use container names
      # Allow frontend container origin
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDORIGINS_0: http://frontend
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDORIGINS_1: http://localhost
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDORIGINS_2: ${ALLOWED_ORIGIN:-http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # -----------------------------------------------------------
  # Frontend — port 80
  # React SPA served by Nginx; proxies /api/** to api-gateway
  # -----------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: tt-bank-frontend
    networks:
      - tt-bank-net
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

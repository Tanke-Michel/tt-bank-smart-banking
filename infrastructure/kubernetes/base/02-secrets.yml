---
# =============================================================
# Secret — tt-bank-secrets
# All sensitive credentials for the Smart Banking System.
#
# HOW TO GENERATE VALUES:
#   Base64 encode each value before placing it here:
#   echo -n 'your-value' | base64
#
# GENERATE A SECURE JWT SECRET:
#   openssl rand -hex 32 | tr -d '\n' | base64
#
# NEVER commit a real .yml file with actual secrets to git.
# Use Sealed Secrets, Vault, or External Secrets Operator
# in production.
#
# The placeholder values below are base64 of the dev defaults.
# Replace ALL of them before any production deployment.
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: tt-bank-secrets
  namespace: tt-bank
  labels:
    app.kubernetes.io/name: smart-banking-system
type: Opaque
data:
  # ── PostgreSQL ────────────────────────────────────────────
  # echo -n 'CHANGE_ME_postgres_password' | base64
  POSTGRES_PASSWORD: Q0hBTkdFX01FX3Bvc3RncmVzX3Bhc3N3b3Jk

  # ── Redis ────────────────────────────────────────────────
  # echo -n 'CHANGE_ME_redis_password' | base64
  REDIS_PASSWORD: Q0hBTkdFX01FX3JlZGlzX3Bhc3N3b3Jk

  # ── RabbitMQ ─────────────────────────────────────────────
  # echo -n 'CHANGE_ME_rabbitmq_password' | base64
  RABBITMQ_PASSWORD: Q0hBTkdFX01FX3JhYmJpdG1xX3Bhc3N3b3Jk

  # ── JWT signing key ───────────────────────────────────────
  # MUST be identical in api-gateway and auth-service
  # openssl rand -hex 32 | tr -d '\n' | base64
  JWT_SECRET: M2Q3ZjRhOWIyYzhlMWY1YTZkOWIzYzdlMmY4YTFkNGI3ZTNjOWYyYTZiNWQ4ZTFjNGY3YTJiM2Q2ZTlmMGMx

  # ── SMTP credentials ──────────────────────────────────────
  # echo -n 'your-gmail@gmail.com' | base64
  SMTP_USERNAME: Q0hBTkdFX01FX3lvdXJfZ21haWxAZ21haWwuY29t
  # echo -n 'your-gmail-app-password' | base64
  SMTP_PASSWORD: Q0hBTkdFX01FX3lvdXJfYXBwX3Bhc3N3b3Jk

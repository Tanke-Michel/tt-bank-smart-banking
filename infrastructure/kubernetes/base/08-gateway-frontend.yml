---
# =============================================================
# API Gateway — Deployment + Service
# Port 8080 | Single entry point for all backend services
# JWT validation, rate limiting, CORS, request logging
# Depends on: all 7 backend services
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tt-bank
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path:   "/actuator/prometheus"
        prometheus.io/port:   "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: ttbank/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            # JWT — must match auth-service
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tt-bank-secrets
                  key: JWT_SECRET
            # Override all upstream URIs to use K8s service DNS names
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
              value: "http://auth-service:8081"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
              value: "http://wallet-service:8082"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_URI
              value: "http://transaction-service:8083"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_3_URI
              value: "http://merchant-service:8084"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_4_URI
              value: "http://notification-service:8085"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_5_URI
              value: "http://savings-service:8086"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_6_URI
              value: "http://audit-service:8087"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              valueFrom:
                configMapKeyRef:
                  name: tt-bank-config
                  key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "600m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 70
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tt-bank
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http

---
# =============================================================
# Frontend — Deployment + Service
# Port 80 | React SPA served by Nginx
# Proxies /api/** to api-gateway
# Depends on: api-gateway
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tt-bank
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: frontend
          image: ttbank/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tt-bank
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http

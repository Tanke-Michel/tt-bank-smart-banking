# =============================================================
# Smart Banking System — Nginx Reverse Proxy
# Installed on the Contabo VPS host (not inside Docker)
# Routes public traffic into the Docker container stack
#
# Setup:
#   sudo cp smart-banking.conf /etc/nginx/sites-available/smart-banking
#   sudo ln -s /etc/nginx/sites-available/smart-banking /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS (strongly recommended):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com
# =============================================================

# ---------------------------------------------------------------
# Upstream definitions — map to Docker-exposed ports
# ---------------------------------------------------------------
upstream frontend_upstream {
    server 127.0.0.1:80;
    keepalive 32;
}

upstream gateway_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream rabbitmq_mgmt_upstream {
    server 127.0.0.1:15672;
    keepalive 8;
}

# ---------------------------------------------------------------
# Rate limiting zones (apply to public-facing routes)
# ---------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:5m   rate=5r/m;

# ---------------------------------------------------------------
# HTTP — redirect all traffic to HTTPS
# (uncomment after setting up Certbot)
# ---------------------------------------------------------------
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ---------------------------------------------------------------
# Main server block
# Replace 'yourdomain.com' with your actual domain or VPS IP
# ---------------------------------------------------------------
server {
    listen 80;
    # listen 443 ssl;  # uncomment after Certbot
    server_name yourdomain.com www.yourdomain.com;

    # -- SSL certificates (auto-managed by Certbot) --
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # -------------------------------------------------------
    # Security headers
    # -------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------
    # Logging
    # -------------------------------------------------------
    access_log /var/log/nginx/smart-banking.access.log combined;
    error_log  /var/log/nginx/smart-banking.error.log warn;

    # -------------------------------------------------------
    # Client upload size limit
    # -------------------------------------------------------
    client_max_body_size 10M;

    # -------------------------------------------------------
    # Auth endpoints — strict rate limiting (brute-force protection)
    # -------------------------------------------------------
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------
    # All other API routes — standard rate limiting
    # -------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass         http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------
    # RabbitMQ Management UI — restrict to trusted IPs only
    # Replace 0.0.0.0 with your actual admin IP
    # -------------------------------------------------------
    location /rabbitmq/ {
        # allow 203.0.113.10;   # your admin IP
        # deny  all;
        proxy_pass         http://rabbitmq_mgmt_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        rewrite            ^/rabbitmq/(.*)$ /$1 break;
    }

    # -------------------------------------------------------
    # Frontend — React SPA (catch-all, must be last)
    # -------------------------------------------------------
    location / {
        proxy_pass         http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# =====================================================================
# Notification Service — Test Configuration
# No database. RabbitMQ and Mail are mocked via @MockBean.
# =====================================================================
spring.application.name=notification-service-test

# RabbitMQ — disabled; mocked via @MockBean
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# RabbitMQ exchange (must match RabbitMQConfig.java)
app.rabbitmq.exchange=test.smart-banking.exchange

# Mail — mocked via @MockBean in test classes
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
app.mail.from=test@smartbanking.com
app.mail.from-name=Smart Banking Test

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.example.notification_service=WARN
logging.level.org.springframework.mail=WARN

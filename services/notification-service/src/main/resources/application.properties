# =====================================================
# Smart Banking - Notification Service Configuration
# Port 8085
# =====================================================
spring.application.name=notification-service
server.port=8085

# =====================================================
# RabbitMQ — consume events from all services
# Credentials match docker-compose.yml
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Shared exchange (same for all services)
app.rabbitmq.exchange=smart-banking.exchange

# =====================================================
# Email / SMTP Configuration
# Using Gmail SMTP as the example provider.
# Replace with real credentials before production.
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender display name and address (matches auth-service)
app.mail.from=noreply@smartbanking.com
app.mail.from-name=Smart Banking

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Logging
# =====================================================
logging.level.com.example.notification_service=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.mail=DEBUG

# =====================================================
# Micrometer Prometheus configuration   
# =====================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
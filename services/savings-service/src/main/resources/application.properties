# =====================================================
# Smart Banking - Community Savings Service
# Port 8086
# =====================================================
spring.application.name=savings-service
server.port=8086

# =====================================================
# Database — tt_bank_savings (dedicated per service)
# Credentials match docker-compose.yml
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tt_bank_savings
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# RabbitMQ — publish savings events
# Credentials match docker-compose.yml
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Shared exchange used across all services
app.rabbitmq.exchange=smart-banking.exchange

# Routing keys for savings events
app.rabbitmq.savings.group-created-routing-key=savings.group.created
app.rabbitmq.savings.contribution-made-routing-key=savings.contribution.made
app.rabbitmq.savings.payout-processed-routing-key=savings.payout.processed
app.rabbitmq.savings.member-joined-routing-key=savings.member.joined

# =====================================================
# Wallet Service base URL
# =====================================================
app.wallet-service.base-url=http://localhost:8082

# =====================================================
# Business rules
# =====================================================
# Maximum members allowed in a single savings group
app.savings.max-members-per-group=50
# Minimum contribution amount per cycle
app.savings.min-contribution-amount=100

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Logging
# =====================================================
logging.level.com.example.savings_service=DEBUG
logging.level.org.springframework.amqp=INFO

# =====================================================
# Micrometer Prometheus configuration
# =====================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
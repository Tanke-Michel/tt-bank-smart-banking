# =====================================================================
# API Gateway — Test Configuration
# Reactive (WebFlux) — no JPA, no RabbitMQ.
# =====================================================================
spring.application.name=api-gateway-test

# JWT — fixed test secret (same length as production)
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

logging.level.com.example.api_gateway=WARN
logging.level.org.springframework.cloud.gateway=WARN

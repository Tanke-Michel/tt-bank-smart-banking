# API Gateway — Docker profile
# Overrides all upstream URIs to use container hostnames
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter
          metadata:
            public-paths: "/api/v1/auth/register,/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/verify-email,/api/v1/auth/resend-verification,/api/v1/auth/forgot-password,/api/v1/auth/reset-password"

        - id: wallet-service
          uri: http://wallet-service:8082
          predicates:
            - Path=/api/v1/wallet/**
          filters:
            - name: JwtAuthenticationFilter

        - id: transaction-service
          uri: http://transaction-service:8083
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: JwtAuthenticationFilter

        - id: merchant-service
          uri: http://merchant-service:8084
          predicates:
            - Path=/api/v1/merchants/**
          filters:
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter

        - id: savings-service
          uri: http://savings-service:8086
          predicates:
            - Path=/api/v1/savings/**
          filters:
            - name: JwtAuthenticationFilter

        - id: audit-service
          uri: http://audit-service:8087
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: JwtAuthenticationFilter

# =====================================================
# Smart Banking - Merchant Service Configuration
# Port 8084
# =====================================================
spring.application.name=merchant-service
server.port=8084

# =====================================================
# Database — dedicated DB per service
# Credentials match docker-compose.yml
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tt_bank_merchant
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# RabbitMQ
# Credentials match docker-compose.yml
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Shared exchange used across all services
app.rabbitmq.exchange=smart-banking.exchange

# Routing keys for merchant payment events
app.rabbitmq.merchant.payment-initiated-routing-key=merchant.payment.initiated
app.rabbitmq.merchant.payment-completed-routing-key=merchant.payment.completed
app.rabbitmq.merchant.payment-failed-routing-key=merchant.payment.failed
app.rabbitmq.merchant.registered-routing-key=merchant.registered

# =====================================================
# Wallet Service base URL — for debit during payments
# =====================================================
app.wallet-service.base-url=http://localhost:8082

# =====================================================
# QR Code settings
# =====================================================
app.qr.width=300
app.qr.height=300

# =====================================================
# Business rules
# =====================================================
app.merchant.max-payment-amount=50000000
app.merchant.min-payment-amount=1

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Logging
# =====================================================
logging.level.com.example.merchant_service=DEBUG
logging.level.org.springframework.amqp=INFO

# =====================================================
# Micrometer Prometheus configuration
# =====================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
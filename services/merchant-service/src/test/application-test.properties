# =====================================================================
# Merchant Service — Test Configuration
# H2 in-memory database, RabbitMQ mocked via @MockBean.
# =====================================================================
spring.application.name=merchant-service-test

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:merchant_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# RabbitMQ — mocked via @MockBean in test classes
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ autoconfiguration disabled when running pure unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Business rules
app.wallet-service.base-url=http://localhost:8082
app.merchant.max-payment-amount=50000000
app.merchant.min-payment-amount=1
app.qr.width=300
app.qr.height=300

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

logging.level.com.example.merchant_service=WARN
logging.level.org.springframework.amqp=WARN

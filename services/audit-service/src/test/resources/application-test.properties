spring.application.name=audit-service-test
 
spring.datasource.url=jdbc:h2:mem:audit_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
 
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
 
app.rabbitmq.exchange=smart-banking.exchange
 
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
 
logging.level.com.example.audit_service=WARN
logging.level.org.springframework.amqp=WARN

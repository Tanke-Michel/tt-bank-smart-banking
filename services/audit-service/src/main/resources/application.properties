# =====================================================
# Smart Banking - Audit & Admin Service Configuration
# Port 8087
# =====================================================
spring.application.name=audit-service
server.port=8087

# =====================================================
# Database — tt_bank_audit (dedicated per service)
# Credentials match docker-compose.yml
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tt_bank_audit
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# RabbitMQ — consume all 14 banking events
# Credentials match docker-compose.yml
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Shared exchange — same for all services
app.rabbitmq.exchange=smart-banking.exchange

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Logging
# =====================================================
logging.level.com.example.audit_service=DEBUG
logging.level.org.springframework.amqp=INFO

# =====================================================
# Micrometer Prometheus configuration
# =====================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# =====================================================
# Smart Banking - Transaction Service Configuration
# Port 8083
# =====================================================
spring.application.name=transaction-service
server.port=8083

# =====================================================
# Database — dedicated DB per service (microservices pattern)
# Credentials match docker-compose.yml
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tt_bank_transaction
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# RabbitMQ — publish transfer events
# Credentials match docker-compose.yml
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Exchange (same exchange used by wallet-service for unified routing)
app.rabbitmq.exchange=smart-banking.exchange

# Routing keys for transfer events
app.rabbitmq.transaction.initiated-routing-key=transaction.initiated
app.rabbitmq.transaction.completed-routing-key=transaction.completed
app.rabbitmq.transaction.failed-routing-key=transaction.failed

# =====================================================
# Wallet Service base URL — for internal HTTP calls
# Transaction service calls wallet service to move money
# =====================================================
app.wallet-service.base-url=http://localhost:8082

# =====================================================
# Business rules
# =====================================================
# Maximum single transfer amount
app.transaction.max-transfer-amount=5000000
# Minimum transfer amount
app.transaction.min-transfer-amount=1
# Maximum daily transfer total
app.transaction.daily-transfer-limit=10000000

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Logging
# =====================================================
logging.level.com.example.transaction_service=DEBUG
logging.level.org.springframework.amqp=INFO

# =====================================================
# Micrometer Prometheus configuration
# =====================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
# =====================================================
# Smart Banking - Wallet Service Configuration
# =====================================================
spring.application.name=wallet-service
server.port=8082

# =====================================================
# Database — tt_bank_wallet (separate DB from auth)
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tt_bank_wallet
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# RabbitMQ — publish wallet-created events
# =====================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Exchange and queue names (shared constants)
app.rabbitmq.exchange=smart-banking.exchange
app.rabbitmq.wallet.created-routing-key=wallet.created
app.rabbitmq.wallet.funded-routing-key=wallet.funded
app.rabbitmq.wallet.withdrawn-routing-key=wallet.withdrawn

# =====================================================
# Business rules
# =====================================================
# Maximum single deposit amount (XAF)
app.wallet.max-deposit-amount=10000000
# Maximum single withdrawal amount (XAF)
app.wallet.max-withdrawal-amount=5000000
# Maximum daily withdrawal limit (XAF)
app.wallet.daily-withdrawal-limit=10000000
# Minimum balance required after withdrawal
app.wallet.minimum-balance=0

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Logging
# =====================================================
logging.level.com.example.wallet_service=DEBUG
logging.level.org.springframework.amqp=INFO

# =====================================================
# Micrometer Prometheus configuration
# =====================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
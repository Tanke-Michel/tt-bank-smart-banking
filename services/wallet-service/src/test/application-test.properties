# =====================================================================
# Wallet Service — Test Configuration
# H2 in-memory database, RabbitMQ mocked via @MockBean.
# =====================================================================
spring.application.name=wallet-service-test

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:wallet_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# RabbitMQ — mocked via @MockBean in test classes
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ autoconfiguration disabled when running pure unit tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Business rules
app.wallet.max-deposit-amount=10000000
app.wallet.max-withdrawal-amount=5000000
app.wallet.daily-withdrawal-limit=10000000
app.wallet.minimum-balance=0

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

logging.level.com.example.wallet_service=WARN
logging.level.org.springframework.amqp=WARN

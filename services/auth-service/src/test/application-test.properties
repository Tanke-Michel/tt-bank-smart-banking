# =====================================================================
# Auth Service — Test Configuration
# Loaded when SPRING_PROFILES_ACTIVE=test or @TestPropertySource
# Uses H2 in-memory database instead of PostgreSQL.
# Redis and Mail are mocked via @MockBean in test classes.
# =====================================================================
spring.application.name=auth-service-test

# H2 in-memory database — no external PostgreSQL required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — create schema from entities, drop on exit
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Redis — disabled for tests (mocked via @MockBean)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Mail — disabled for tests (mocked via @MockBean)
spring.mail.host=localhost
spring.mail.port=25

# JWT — fixed test secret (64 hex chars = 256-bit HS256 key)
jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=86400000

# OTP
otp.expiration-minutes=10
otp.length=6

# App
app.base-url=http://localhost:5173
app.mail.from=test@smartbanking.com
app.mail.from-name=Smart Banking Test

# Actuator — expose all for test assertions
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Logging — reduce noise in test output
logging.level.com.example.auth_service=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# =====================================================
# Smart Banking - Auth Service Configuration
# =====================================================
spring.application.name=auth-service
server.port=8081

# =====================================================
# Database Configuration
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tt_bank_auth
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# =====================================================
# Redis Configuration (OTP + token blacklisting)
# =====================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# =====================================================
# JWT Configuration
# =====================================================
jwt.secret=3d7f4a9b2c8e1f5a6d9b3c7e2f8a1d4b7e3c9f2a6b5d8e1c4f7a2b3d6e9f0c1
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# =====================================================
# OTP Configuration
# =====================================================
otp.expiration-minutes=10
otp.length=6

# =====================================================
# Email / SMTP Configuration
# Replace with real SMTP credentials before production.
# Using Gmail SMTP as example.
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender display name and address
app.mail.from=noreply@smartbanking.com
app.mail.from-name=Smart Banking

# =====================================================
# App base URL (used in email links)
# =====================================================
app.base-url=http://localhost:5173

# =====================================================
# Logging
# =====================================================
logging.level.com.example.auth_service=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=DEBUG

# =====================================================
# Micrometer Prometheus configuration           
# =====================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always